                    "title": "NIPT的时点选择与胎儿的异常判定",
                    "questions": [
                        "分析Y染色体浓度与孕周数和BMI的相关特性",
                        "基于BMI分组确定最佳NIPT时点",
                        "综合考虑多因素的分组和时点确定",
                        "给出女胎异常判定方法"
                    ],
                    "models": ["分类模型", "预测模型", "医学应用"]
                },
                "D": {
                    "title": "矿井突水水流漫延模型与逃生方案",
                    "questions": [
                        "建立突水水流在巷道的流动漫延模型",
                        "为矿工设计最佳逃生路径",
                        "建立双突水点的水流漫延模型",
                        "在第二突水点出现后调整逃生方案"
                    ],
                    "models": ["流体动力学", "网络流模型", "最短路径"]
                },
                "E": {
                    "title": "AI辅助智能体测",
                    "questions": [
                        "确定运动者的起跳和落地时刻并描述滞空阶段",
                        "分析影响跳远成绩的主要因素",
                        "预测运动者的实际跳远成绩",
                        "给出提升跳远成绩的姿势训练建议"
                    ],
                    "models": ["数据分析", "运动学分析", "预测模型"]
                }
            }
        };

        // 初始化表格
        function initTable() {
            renderTable(allData);
            updateStats();
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let count = 0;

            for (const year in data) {
                const problems = data[year];
                for (const code in problems) {
                    const problem = problems[code];
                    const row = createTableRow(year, code, problem);
                    tbody.appendChild(row);
                    count++;
                }
            }

            document.getElementById('currentCount').textContent = count;
        }

        // 创建表格行
        function createTableRow(year, code, problem) {
            const tr = document.createElement('tr');
            tr.className = 'data-row';
            tr.dataset.year = year;
            tr.dataset.code = code;
            tr.dataset.text = (problem.title + ' ' + problem.questions.join(' ')).toLowerCase();

            const yearCell = document.createElement('td');
            yearCell.innerHTML = `<span class="year-badge">${year}</span>`;

            const codeCell = document.createElement('td');
            codeCell.innerHTML = `<span class="problem-code">${code}</span>`;

            const titleCell = document.createElement('td');
            titleCell.innerHTML = `<div class="title">${problem.title}</div>`;

            const questionsCell = document.createElement('td');
            questionsCell.innerHTML = '<div class="questions">' +
                problem.questions.map((q, i) => `<div class="question-item"><strong>问题${i+1}:</strong> ${q}</div>`).join('') +
                '</div>';

            const modelsCell = document.createElement('td');
            modelsCell.innerHTML = '<div class="models">' +
                problem.models.map(m => {
                    let className = 'model-tag';
                    if (m.includes('优化')) className += ' opt';
                    else if (m.includes('评价')) className += ' eval';
                    else if (m.includes('预测')) className += ' pred';
                    else if (m.includes('分类')) className += ' class';
                    else if (m.includes('微分')) className += ' diff';
                    else if (m.includes('数据')) className += ' data';
                    return `<span class="${className}">${m}</span>`;
                }).join('') +
                '</div>';

            tr.appendChild(yearCell);
            tr.appendChild(codeCell);
            tr.appendChild(titleCell);
            tr.appendChild(questionsCell);
            tr.appendChild(modelsCell);

            return tr;
        }

        // 筛选表格
        function filterTable() {
            const year = document.getElementById('yearFilter').value;
            const code = document.getElementById('codeFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const rows = document.querySelectorAll('.data-row');
            let visibleCount = 0;

            rows.forEach(row => {
                let show = true;

                if (year && row.dataset.year !== year) show = false;
                if (code && row.dataset.code !== code) show = false;
                if (search && !row.dataset.text.includes(search)) show = false;

                row.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });

            document.getElementById('currentCount').textContent = visibleCount;
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('codeFilter').value = '';
            document.getElementById('searchInput').value = '';
            filterTable();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalCount').textContent =
                Object.keys(allData).reduce((sum, year) => sum + Object.keys(allData[year]).length, 0);
        }

        // 事件监听
        document.getElementById('yearFilter').addEventListener('change', filterTable);
        document.getElementById('codeFilter').addEventListener('change', filterTable);
        document.getElementById('searchInput').addEventListener('keyup', filterTable);

        // 初始化
        initTable();
    </script>
</body>
</html>
